<!DOCTYPE html>
<html lang="en">
    <head>
        {% block head %}
        <title>{% block title %} {% endblock %} - Barber</title>
        {% endblock %}
        <!-- Add bootstrap -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <!-- Add own css -->
        <link rel="stylesheet" href="/static/style.css"/>
        <!-- <link rel="stylesheet" href="/static/style.css"> -->
    </head>

    <body class="bgBlueBarber">
        <!-- Create navbar -->
        <!-- It was created with the help of Bootstrap docs https://getbootstrap.com/docs/5.3/components/navbar/?#forms-->
        <nav class="navbar navbar-expand-md sticky-top bgRedNav">
            <div class="container-fluid ">
                <a class="navbar-brand textColorWhite" href="/">Barber learning</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggle" aria-controls="navbarToggle" aria-expanded="false" aria-label="Toggle Navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Navbar items -->
                <div class="collapse navbar-collapse" id="navbarToggle">
                    <!-- Nav Search -->
                    <form class="d-flex mx-auto mt-2 mt-lg-0" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                    <!-- Nav Right items -->
                    <div class="navbar-nav justify-content-end">
                        <a href="/" class="nav-link textColorWhite">Create Course</a>
                        <a href="/" class="nav-link textColorWhite">Sign In</a>
                        <a href="/" class="nav-link textColorWhite">Log In</a>
                    </div>
                </div>
            </div>
        </nav>
    <!-- Body continues -->
    <!-- Create two main columns within a row -->
    <div class="row">
        <!-- First column for hamburguer list -->
        <div class="col">
            
            <nav class="nav flex-column bgBlueColumn">
                tes
            </nav>
        </div>
        <!-- Second column (where content is going to be) -->
        <div class="col">
            test
        </div>
    </div>
    test

    </body>
</html>
