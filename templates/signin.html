{% extends 'layout.html' %}
{% block title %}
Sign In
{% endblock %}
{% block main %}
<div class="container-fluid mt-2 text-center display-4"> 
    Sign In
</div>
<div class="row">
    <div class="col"></div>
    <div class="col text-center">
        <!-- Here the content will be -->
        <div class="container">
            <form action="/signin" method="POST">
                <div class="row mt-4 mx-3 gx-1">
                    <div class="col-lg col-md">
                        <div class="form-floating">
                            <input type="text" name="username" id="username" class="form-control" placeholder="Username">
                            <label for="username">Username</label>
                        </div>
                    </div>
                    <div class="col-lg col-md">
                        <div class="form-floating mb-3">
                            <input type="text" name="name" id="name" class="form-control" placeholder="Name">
                            <label for="name">Name</label>
                        </div>      
                    </div>
                </div>
                <div class="form-floating mx-3">
                    <input type="text" name="email" id="email" class="form-control" placeholder="Email">
                    <label for="email" class="form-label">Email</label>
                </div>
                
                <div class="form-floating mx-3">
                    <input type="password" name="password" id="password" class="form-control" aria-describedby="passwordHelpBlock" placeholder="Password">
                    <label for="password" class="form-label">Password</label>
                </div>
                
                <div class="form-floating mx-3">
                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Confirm Password">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                </div>
                
                <div id="passwordHelpBlock" class="form-text">Your password must be 6-20 characters long</div>
                <button type="submit" class="btn btn-light mt-2">Submit</button>
            </form>
        </div>
    </div>
    <div class="col"></div>
</div>
{% endblock %}
