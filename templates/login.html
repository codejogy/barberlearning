{% extends 'layout.html' %}
{% block title %}Login{% endblock %}
{% block main %} 
    <div class="container-fluid text-center lead">
        <div class="row">
            <div class="col"></div>
            <div class="col display-4  rounded-pill mt-3">
                <p>Log In</p>
            </div>
            <div class="col"></div>
        </div>
    </div>
    <!-- <div class="container-fluid text-center lead bg-light mt-3"> -->
    <div class="row">
        <div class="col"></div>
        <div class="col-3 text-center mt-4 textColorLogIn rounded-4">
            <form>
                <div class="h3 mt-1">
                    Email
                </div>
                <input class="form-control" placeholder="email@domain.com" type="email">
                <div class="h3 mt-3">
                    Password
                </div>
                <input class="form-control" type="password">
                <div class="mt-3 mb-3">
                    <button type="submit" class="btn btn-outline-light btn-lg">Log In </button>
                </div>
            </form>
        </div>
        <div class="col"></div>
    </div>
        <div class="col"></div>
    </div>
    <!-- </div> -->
{% endblock %}
